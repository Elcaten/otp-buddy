name: Nightly E2E

on:
  schedule:
    # Run at 03:00 UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build Chrome extension
        run: npm run build:chrome
        env:
          VITE_OTP_BUDDY_SAFARI_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_SAFARI_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_SECRET: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_SECRET }}

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-chrome
          path: extension/chrome

  # Tier 2+3: Provider integration tests
  e2e-providers:
    runs-on: ubuntu-latest
    needs: build-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Download extension
        uses: actions/download-artifact@v4
        with:
          name: extension-chrome
          path: extension/chrome

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Fastmail E2E tests
        run: npm run test:e2e:chromium:fastmail
        env:
          FASTMAIL_TEST_API_KEY: ${{ secrets.FASTMAIL_TEST_API_KEY }}
          FASTMAIL_TEST_ACCOUNT_ID: ${{ secrets.FASTMAIL_TEST_ACCOUNT_ID }}
          TEST_EMAIL_FASTMAIL: ${{ secrets.TEST_EMAIL_FASTMAIL }}

      - name: Run Gmail E2E tests
        run: npm run test:e2e:chromium:gmail
        env:
          GMAIL_TESTER_CREDENTIALS_JSON: ${{ secrets.GMAIL_TESTER_CREDENTIALS_JSON }}
          GMAIL_TESTER_TOKEN_JSON: ${{ secrets.GMAIL_TESTER_TOKEN_JSON }}
          GMAIL_TEST_REFRESH_TOKEN: ${{ secrets.GMAIL_TEST_REFRESH_TOKEN }}
          TEST_EMAIL_GMAIL: ${{ secrets.TEST_EMAIL_GMAIL }}
          VITE_OTP_BUDDY_WEB_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_SECRET: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_SECRET }}

  # Tier 4: Real login service OTP tests
  e2e-nightly:
    runs-on: ubuntu-latest
    needs: build-chrome
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Download extension
        uses: actions/download-artifact@v4
        with:
          name: extension-chrome
          path: extension/chrome

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run nightly E2E tests (real login services)
        run: npm run test:e2e:chromium:nightly
        env:
          FASTMAIL_TEST_API_KEY: ${{ secrets.FASTMAIL_TEST_API_KEY }}
          FASTMAIL_TEST_ACCOUNT_ID: ${{ secrets.FASTMAIL_TEST_ACCOUNT_ID }}
          TEST_EMAIL_FASTMAIL: ${{ secrets.TEST_EMAIL_FASTMAIL }}
          GMAIL_TESTER_CREDENTIALS_JSON: ${{ secrets.GMAIL_TESTER_CREDENTIALS_JSON }}
          GMAIL_TESTER_TOKEN_JSON: ${{ secrets.GMAIL_TESTER_TOKEN_JSON }}
          GMAIL_TEST_REFRESH_TOKEN: ${{ secrets.GMAIL_TEST_REFRESH_TOKEN }}
          TEST_EMAIL_GMAIL: ${{ secrets.TEST_EMAIL_GMAIL }}
          TEST_GITLAB_EMAIL: ${{ secrets.TEST_GITLAB_EMAIL }}
          TEST_POLYMARKET_EMAIL: ${{ secrets.TEST_POLYMARKET_EMAIL }}
          VITE_OTP_BUDDY_WEB_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_SECRET: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-playwright-report
          path: test-results/
          retention-days: 7
