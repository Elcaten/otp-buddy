name: Build Safari (unsigned)

on:
  workflow_call:

jobs:
  build-safari-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env

      - name: Build Chrome extension assets for Safari project
        run: npm run build:chrome
        env:
          VITE_OTP_BUDDY_SAFARI_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_SAFARI_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_SECRET: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_SECRET }}

      - name: Debug Xcode project metadata
        run: xcodebuild -list -project "safari/OTPBuddy/OTPBuddy.xcodeproj"

      - name: Build Safari
        env:
          BUILD_KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          SAFARI_BUILD_DIR="$GITHUB_WORKSPACE/safari/OTPBuddy/build"

          cleanup() {
            rm -f "$CERT_PATH"
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Materialize certificate from base64 secret
          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          # Keychain setup
          security create-keychain -p "$BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$BUILD_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "/Library/Keychains/System.keychain"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          # Build (automatic signing)
          xcodebuild \
            -project "safari/OTPBuddy/OTPBuddy.xcodeproj" \
            -target "OTPBuddy (macOS)" \
            -configuration Release \
            SYMROOT="$SAFARI_BUILD_DIR" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="Apple Development" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            build

      - name: Upload Safari build products
        uses: actions/upload-artifact@v4
        with:
          name: safari-build-unsigned
          path: ${{ github.workspace }}/safari/OTPBuddy/build/Release

      - name: Create DMG installer
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/safari/OTPBuddy/build"
          APP_PATH="$BUILD_DIR/Release/OTPBuddy.app"
          STAGING="$BUILD_DIR/dmg-staging"
          DMG_PATH="$BUILD_DIR/OTPBuddy.dmg"

          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "OTPBuddy" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_PATH"

      - name: Upload Safari DMG
        uses: actions/upload-artifact@v4
        with:
          name: safari-build-unsigned-dmg
          path: ${{ github.workspace }}/safari/OTPBuddy/build/OTPBuddy.dmg
