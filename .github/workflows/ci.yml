name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint
      - run: npm run test

  # Build extension (needs 1Password secrets). Uploads extension/chrome as artifact.
  build-chrome:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Load env from 1Password
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VITE_OTP_BUDDY_SAFARI_CLIENT_ID: op://CLI-OTP-Buddy/otp-buddy-safari-native-app/client_id
          VITE_OTP_BUDDY_WEB_CLIENT_ID: op://CLI-OTP-Buddy/otp-buddy-web/client_id
          VITE_OTP_BUDDY_WEB_CLIENT_SECRET: op://CLI-OTP-Buddy/otp-buddy-web/client_secret

      - run: npm run build:chrome

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-chrome
          path: extension/chrome

  e2e-chromium:
    runs-on: ubuntu-latest
    needs: build-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Download extension
        uses: actions/download-artifact@v4
        with:
          name: extension-chrome
          path: extension/chrome

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e:chromium
