name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint
      - run: npm run test

  # Build extension. Uploads extension/chrome as artifact.
  build-chrome:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build Chrome extension
        run: npm run build:chrome
        env:
          VITE_OTP_BUDDY_SAFARI_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_SAFARI_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_SECRET: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_SECRET }}

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-chrome
          path: extension/chrome

      - name: Upload Chrome package
        uses: actions/upload-artifact@v4
        with:
          name: extension-chrome-zip
          path: extension/chrome.zip

  build-firefox:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build Firefox extension
        run: npm run build:firefox
        env:
          VITE_OTP_BUDDY_SAFARI_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_SAFARI_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_SECRET: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_SECRET }}

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-firefox
          path: extension/firefox

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: extension-firefox-xpi
          path: extension/firefox.xpi

  # Build Safari app/extension wrapper unsigned on macOS.
  build-safari-unsigned:
    runs-on: macos-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build Chrome extension assets for Safari project
        run: npm run build:chrome
        env:
          VITE_OTP_BUDDY_SAFARI_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_SAFARI_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_SECRET: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_SECRET }}

      - name: Debug Xcode project metadata
        run: xcodebuild -list -project "safari/OTPBuddy/OTPBuddy.xcodeproj"

      - name: Build Safari app (unsigned)
        run: |
          SAFARI_BUILD_DIR="$GITHUB_WORKSPACE/safari/OTPBuddy/build"
          xcodebuild \
            -project "safari/OTPBuddy/OTPBuddy.xcodeproj" \
            -target "OTPBuddy (macOS)" \
            -configuration Release \
            SYMROOT="$SAFARI_BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Debug Safari build outputs
        run: |
          ls -la "$GITHUB_WORKSPACE/safari/OTPBuddy/build"
          ls -la "$GITHUB_WORKSPACE/safari/OTPBuddy/build/Release"

      - name: Upload Safari build products
        uses: actions/upload-artifact@v4
        with:
          name: safari-build-unsigned
          path: ${{ github.workspace }}/safari/OTPBuddy/build/Release

      - name: Package Safari build products
        run: |
          cd "$GITHUB_WORKSPACE/safari/OTPBuddy/build"
          ditto -c -k --sequesterRsrc --keepParent Release safari-unsigned.zip

      - name: Upload Safari package
        uses: actions/upload-artifact@v4
        with:
          name: safari-build-unsigned-zip
          path: ${{ github.workspace }}/safari/OTPBuddy/build/safari-unsigned.zip

  e2e-chromium:
    runs-on: ubuntu-latest
    needs: build-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Download extension
        uses: actions/download-artifact@v4
        with:
          name: extension-chrome
          path: extension/chrome

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e:chromium

  # Attach packaged extensions from build jobs to GitHub Release on tag push (e.g. v1.0.0).
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-chrome, build-firefox, build-safari-unsigned]
    permissions:
      contents: write
    steps:
      - name: Download Chrome package
        uses: actions/download-artifact@v4
        with:
          name: extension-chrome-zip
          path: release-assets

      - name: Download Firefox package
        uses: actions/download-artifact@v4
        with:
          name: extension-firefox-xpi
          path: release-assets

      - name: Download Safari package
        uses: actions/download-artifact@v4
        with:
          name: safari-build-unsigned-zip
          path: release-assets

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/chrome.zip
            release-assets/firefox.xpi
            release-assets/safari-unsigned.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
