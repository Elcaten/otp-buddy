name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    uses: ./.github/workflows/lint-and-test.yml

  build-chrome:
    needs: lint-and-test
    uses: ./.github/workflows/build-chrome.yml
    secrets: inherit

  build-firefox:
    needs: lint-and-test
    uses: ./.github/workflows/build-firefox.yml
    secrets: inherit

  build-safari-unsigned:
    if: startsWith(github.ref, 'refs/tags/')
    needs: lint-and-test
    uses: ./.github/workflows/build-safari.yml
    secrets: inherit

  e2e-chromium:
    needs: build-chrome
    uses: ./.github/workflows/e2e-chromium.yml

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-chrome, build-firefox, build-safari-unsigned]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
