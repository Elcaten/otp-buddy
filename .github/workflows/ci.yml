name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-test:
    uses: ./.github/workflows/lint-and-test.yml

  build-chrome:
    needs: lint-and-test
    uses: ./.github/workflows/build-chrome.yml
    secrets: inherit

  build-firefox:
    needs: lint-and-test
    uses: ./.github/workflows/build-firefox.yml
    secrets: inherit

  sign-firefox:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-firefox
    uses: ./.github/workflows/sign-firefox.yml
    secrets: inherit

  build-safari-unsigned:
    if: startsWith(github.ref, 'refs/tags/')
    needs: lint-and-test
    uses: ./.github/workflows/build-safari.yml
    secrets: inherit

  e2e-chromium:
    needs: build-chrome
    uses: ./.github/workflows/e2e-chromium.yml

  ci-required:
    name: CI required
    if: always()
    needs: [lint-and-test, build-chrome, build-firefox, e2e-chromium]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          CHECK_RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$CHECK_RESULTS" = 'success,success,success,success'

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-chrome, sign-firefox, build-safari-unsigned]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
