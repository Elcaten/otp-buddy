name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint
      - run: npm run test

  # Build extension. Uploads extension/chrome as artifact.
  build-chrome:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build Chrome extension
        run: npm run build:chrome
        env:
          VITE_OTP_BUDDY_SAFARI_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_SAFARI_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_SECRET: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_SECRET }}

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-chrome
          path: extension/chrome

      - name: Upload Chrome package
        uses: actions/upload-artifact@v4
        with:
          name: extension-chrome-zip
          path: extension/chrome.zip

  build-firefox:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build Firefox extension
        run: npm run build:firefox
        env:
          VITE_OTP_BUDDY_SAFARI_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_SAFARI_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_SECRET: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_SECRET }}

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-firefox
          path: extension/firefox

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: extension-firefox-xpi
          path: extension/firefox.xpi

  # Build Safari app/extension wrapper unsigned on macOS.
  build-safari-unsigned:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build Chrome extension assets for Safari project
        run: npm run build:chrome
        env:
          VITE_OTP_BUDDY_SAFARI_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_SAFARI_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_SECRET: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_SECRET }}

      - name: Debug Xcode project metadata
        run: xcodebuild -list -project "safari/OTPBuddy/OTPBuddy.xcodeproj"

      - name: Build Safari app (unsigned)
        run: |
          SAFARI_BUILD_DIR="$GITHUB_WORKSPACE/safari/OTPBuddy/build"
          xcodebuild \
            -project "safari/OTPBuddy/OTPBuddy.xcodeproj" \
            -target "OTPBuddy (macOS)" \
            -configuration Release \
            SYMROOT="$SAFARI_BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Debug Safari build outputs
        run: |
          ls -la "$GITHUB_WORKSPACE/safari/OTPBuddy/build"
          ls -la "$GITHUB_WORKSPACE/safari/OTPBuddy/build/Release"

      - name: Upload Safari build products
        uses: actions/upload-artifact@v4
        with:
          name: safari-build-unsigned
          path: ${{ github.workspace }}/safari/OTPBuddy/build/Release

      - name: Create DMG installer
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/safari/OTPBuddy/build"
          APP_PATH="$BUILD_DIR/Release/OTPBuddy.app"
          STAGING="$BUILD_DIR/dmg-staging"
          DMG_PATH="$BUILD_DIR/OTPBuddy.dmg"

          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "OTPBuddy" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_PATH"

      - name: Upload Safari DMG
        uses: actions/upload-artifact@v4
        with:
          name: safari-build-unsigned-dmg
          path: ${{ github.workspace }}/safari/OTPBuddy/build/OTPBuddy.dmg

  # Tier 1: Structural E2E tests (no credentials needed)
  e2e-chromium:
    runs-on: ubuntu-latest
    needs: build-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Download extension
        uses: actions/download-artifact@v4
        with:
          name: extension-chrome
          path: extension/chrome

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Tier 1)
        run: npm run test:e2e:chromium

  # Tier 2: Tigrmail integration E2E tests
  e2e-chromium-tigrmail:
    runs-on: ubuntu-latest
    needs: build-chrome
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Download extension
        uses: actions/download-artifact@v4
        with:
          name: extension-chrome
          path: extension/chrome

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Tigrmail E2E tests (Tier 2)
        run: npm run test:e2e:chromium:tigrmail
        env:
          TIGRMAIL_TOKEN: ${{ secrets.TIGRMAIL_TOKEN }}
          GMAIL_TESTER_CREDENTIALS_JSON: ${{ secrets.GMAIL_TESTER_CREDENTIALS_JSON }}
          GMAIL_TESTER_TOKEN_JSON: ${{ secrets.GMAIL_TESTER_TOKEN_JSON }}
          TEST_EMAIL_GMAIL: ${{ secrets.TEST_EMAIL_GMAIL }}

  # Tier 3: Gmail integration E2E tests
  e2e-chromium-gmail:
    runs-on: ubuntu-latest
    needs: build-chrome
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Download extension
        uses: actions/download-artifact@v4
        with:
          name: extension-chrome
          path: extension/chrome

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Gmail E2E tests (Tier 3)
        run: npm run test:e2e:chromium:gmail
        env:
          GMAIL_TESTER_CREDENTIALS_JSON: ${{ secrets.GMAIL_TESTER_CREDENTIALS_JSON }}
          GMAIL_TESTER_TOKEN_JSON: ${{ secrets.GMAIL_TESTER_TOKEN_JSON }}
          GMAIL_TEST_REFRESH_TOKEN: ${{ secrets.GMAIL_TEST_REFRESH_TOKEN }}
          TEST_EMAIL_GMAIL: ${{ secrets.TEST_EMAIL_GMAIL }}
          VITE_OTP_BUDDY_WEB_CLIENT_ID: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_ID }}
          VITE_OTP_BUDDY_WEB_CLIENT_SECRET: ${{ secrets.VITE_OTP_BUDDY_WEB_CLIENT_SECRET }}

  # Attach packaged extensions from build jobs to GitHub Release on tag push (e.g. v1.0.0).
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-chrome, build-firefox, build-safari-unsigned]
    permissions:
      contents: write
    steps:
      - name: Download Chrome package
        uses: actions/download-artifact@v4
        with:
          name: extension-chrome-zip
          path: release-assets

      - name: Download Firefox package
        uses: actions/download-artifact@v4
        with:
          name: extension-firefox-xpi
          path: release-assets

      - name: Download Safari DMG
        uses: actions/download-artifact@v4
        with:
          name: safari-build-unsigned-dmg
          path: release-assets

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/chrome.zip
            release-assets/firefox.xpi
            release-assets/OTPBuddy.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
