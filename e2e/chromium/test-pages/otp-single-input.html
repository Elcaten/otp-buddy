<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OTP Single Input Test Page</title>
  <style>
    body { font-family: sans-serif; padding: 40px; }
    .otp-form { max-width: 400px; margin: 0 auto; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    input { padding: 8px; font-size: 16px; width: 200px; }
    button { margin-top: 12px; padding: 8px 16px; }
    #result { margin-top: 16px; padding: 12px; background: #f0f0f0; display: none; }
  </style>
</head>
<body>
  <div class="otp-form">
    <h1>Verify Your Identity</h1>
    <p>Enter the 6-digit code sent to your email.</p>
    <form id="otpForm">
      <label for="otp">Verification code</label>
      <input
        type="text"
        id="otp"
        name="otp"
        autocomplete="one-time-code"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="6"
        placeholder="000000"
      />
      <br/>
      <button type="submit">Verify</button>
    </form>
    <div id="result"></div>
  </div>
  <script>
    document.getElementById('otpForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const code = document.getElementById('otp').value;
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.textContent = 'Submitted code: ' + code;
      resultDiv.setAttribute('data-submitted-code', code);
    });
  </script>
</body>
</html>
